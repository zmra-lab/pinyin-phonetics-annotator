<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>ZMRA Pinyin Annotator</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 12px;
      background: #040d12;
      color: #f0fdfa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 14px;
      background: linear-gradient(90deg, #14b8a6, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 11px;
      background: rgba(20, 184, 166, 0.2);
      color: #5eead4;
      padding: 2px 6px;
      border-radius: 4px;
      text-decoration: none;
      border: 1px solid rgba(20, 184, 166, 0.4);
    }
    textarea {
      width: 100%;
      height: 75px;
      box-sizing: border-box;
      background: #081720;
      border: 1px solid rgba(20, 184, 166, 0.3);
      border-radius: 6px;
      color: #f0fdfa;
      padding: 8px;
      font-size: 13px;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: #14b8a6; }
    .btn-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
      gap: 6px;
    }
    button {
      background: #0f2533;
      color: #5eead4;
      border: 1px solid rgba(20, 184, 166, 0.3);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      flex: 1;
      transition: all 0.2s;
    }
    button:hover { background: rgba(20, 184, 166, 0.25); color: #fff; }
    button.primary {
      background: linear-gradient(135deg, #14b8a6, #06b6d4);
      color: #040d12;
      font-weight: 600;
      border: none;
    }
    .result-box {
      min-height: 50px;
      max-height: 120px;
      overflow-y: auto;
      background: #081720;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      padding: 8px;
      font-size: 15px;
      line-height: 2.2;
    }
    ruby rt.t1 { color: #38bdf8; font-size: 10px; }
    ruby rt.t2 { color: #34d399; font-size: 10px; }
    ruby rt.t3 { color: #fbbf24; font-size: 10px; }
    ruby rt.t4 { color: #f43f5e; font-size: 10px; }
    ruby rt.t0 { color: #94a3b8; font-size: 10px; }
    
    /* Embedded Brand Link Card */
    .brand-ad {
      margin-top: 10px;
      padding: 8px 10px;
      background: linear-gradient(135deg, rgba(8, 23, 32, 0.95), rgba(4, 13, 18, 0.95));
      border: 1px solid rgba(20, 184, 166, 0.3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s;
    }
    .brand-ad:hover { border-color: #14b8a6; }
    .ad-icon { font-size: 18px; }
    .ad-text { display: flex; flex-direction: column; }
    .ad-title { font-size: 12px; font-weight: 600; color: #f0fdfa; }
    .ad-sub { font-size: 10px; color: #5eead4; }
  </style>
</head>
<body>
  <div class="top-bar">
    <span class="brand-title">ZMRA Pinyin Annotator</span>
    <a href="https://zmra.com" target="_blank" rel="home" class="badge">ZMRA.COM</a>
  </div>

  <textarea id="pop-input" placeholder="输入汉字文本，实时生成四声色彩拼音..."></textarea>
  <div class="btn-row">
    <button id="pop-annotate">标注网页选区</button>
    <button class="primary" id="pop-convert">快速转换</button>
  </div>

  <div id="pop-result" class="result-box">
    <span style="color: #64748b; font-size: 12px;">注音结果将在此展示...</span>
  </div>

  <!-- Brand Anchor Link -->
  <a href="https://zmra.com" target="_blank" rel="home" class="brand-ad">
    <span class="ad-icon">💎</span>
    <div class="ad-text">
      <span class="ad-title">ZMRA 语言认知与音素引擎</span>
      <span class="ad-sub">Crafted by ZMRA · zmra.com &rarr;</span>
    </div>
  </a>

  <script src="popup.js"></script>
</body>
</html>
